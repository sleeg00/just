plugins {
    id 'org.springframework.boot' version '3.1.0'  // ✅ Spring Boot 3.x로 변경
    id 'io.spring.dependency-management' version '1.1.3'
    id 'java'
}

jar {
    enabled = false;
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

sourceCompatibility = '17'  // ✅ Java 17 필수 (Spring Boot 3.x 요구 사항)

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'

    // ✅ Spring Boot 기본 스타터
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // ✅ QueryDSL 최신 버전
    // 끝에 :jakarta 추가
    implementation("com.querydsl:querydsl-jpa:5.0.0:jakarta")
// 끝에 :jpa를 :jakarta로 수정
    annotationProcessor("com.querydsl:querydsl-apt:5.0.0:jakarta")
    annotationProcessor("jakarta.persistence:jakarta.persistence-api")
    annotationProcessor("jakarta.annotation:jakarta.annotation-api")

    testImplementation 'org.projectlombok:lombok:1.18.22'
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    // ✅ JSON 라이브러리 (Jackson이 Spring Boot 기본 지원)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.0'

    // ✅ MySQL 드라이버 최신 버전
    implementation 'mysql:mysql-connector-java:8.0.33'

    // ✅ SLF4J & Logback 최신 버전
    implementation 'org.slf4j:slf4j-api:2.0.7'
    implementation 'ch.qos.logback:logback-classic:1.4.6'

    // ✅ Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // ✅ Spring Boot 3.x용 Elasticsearch 최신 버전
    implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'



    // ✅ JWT (JSON Web Token) 최신 버전
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    implementation 'com.auth0:java-jwt:4.4.0'

    // ✅ Spring Security 최신 버전
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.security:spring-security-oauth2-client'

    // ✅ Gson (JSON 파싱)
    implementation 'com.google.code.gson:gson:2.10.1'

    // ✅ MapStruct 최신 버전
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    // ✅ Local Cache - Caffeine 최신 버전
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.5'

    // ✅ JOOQ 최신 버전
    implementation 'org.jooq:jooq:3.17.6'
    implementation 'org.jooq:jooq-meta:3.17.6'
    implementation 'org.jooq:jooq-codegen:3.17.6'



    // ✅ Swagger (Spring Boot 3.x에서는 `springdoc-openapi` 사용)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.1.0'

    // ✅ Amazon S3 SDK 최신 버전
    implementation 'software.amazon.awssdk:s3:2.20.140'

    // ✅ Logstash 최신 버전
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

    // ✅ Prometheus (모니터링)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // ✅ Redis 최신 버전
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // ✅ Firebase 최신 버전
    implementation 'com.google.firebase:firebase-admin:9.2.0'

    // ✅ Test 관련 의존성 최신화
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'


}

tasks.named('test') {
    useJUnitPlatform()
}

// ✅ Querydsl 설정
def generated = 'src/main/generated'

tasks.withType(JavaCompile) {
    options.getGeneratedSourceOutputDirectory().set(file(generated))
    options.compilerArgs << "-Xlint:unchecked"
}

sourceSets {
    main.java.srcDirs += [generated]
}

clean {
    delete file(generated)
}

global: # Metric 정보 수집 주기
  scrape_interval: 5s

scrape_configs: # 작업 이릉 명시
  - job_name: "ec2 server"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "13.209.204.40:9100"
  - job_name: RDS Exporter Basic
    scrape_interval: 60s
    scrape_timeout: 55s
    metrics_path: /basic
    honor_labels: true
    honor_timestamps: false
    scheme: "http"
    static_configs:
      - targets: [ "host.docker.internal:9042" ]

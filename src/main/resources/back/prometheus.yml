global: # Metric 정보 수집 주기

scrape_configs:
  - job_name: "ec2 server"
    scrape_interval: 30s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "3.38.113.85:9000"
  - job_name: RDS Exporter Basic
    scrape_interval: 60s
    scrape_timeout: 55s
    metrics_path: /basic
    honor_labels: true
    honor_timestamps: false
    scheme: "http"
    static_configs:
      - targets: ["3.38.113.85:9042"]
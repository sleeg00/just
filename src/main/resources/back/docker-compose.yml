version: '3.8'

networks:
  elk:
    driver: bridge

services:
  # Elastic search 설정
  elasticsearch:
    container_name: elasticsearch
    image: elasticsearch:7.17.16
    ports:
      - 9200:9200
      - 9300:9300
    volumes:
      - ./elasticsearch:/usr/share/elasticsearch/data
    user: "1000:1000"
    # Elastic search 계정정보
    environment:
      discovery.type: single-node
      xpack.security.enabled: false # SSL 미적용 추후 변경
      xpack.security.transport.ssl.enabled: false # SSL 미적용 추후 변경
      ELASTIC_USERNAME: "elastic"
      ELASTIC_PASSWORD: "elastic123!@#"
    networks:
      - elk

  # Logstash 설정
  logstash:
    container_name: logstash
    image: docker.elastic.co/logstash/logstash:7.17.16
    ports:
      - 5000:5000
      - 9600:9600
    volumes:
      - ./logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    depends_on:
      - elasticsearch
    networks:
      - elk

  # Kibana 설정
  kibana:
    container_name: kibana
    image: kibana:7.17.16
    ports:
      - 5601:5601
    depends_on:
      - elasticsearch
    volumes:
      - ./kibana/config/kibana.yml:/usr/share/kibana/config/kibana.yml
    networks:
      - elk

  # Spring Boot 설정
  spring_boot:
    container_name: spring_boot
    image: sleeg00/just:backend
    expose:
      - 9000
    ports:
      - 9000:9000
    networks:
      - elk

  # Redis 설정
  my-redis:
    container_name: my-redis
    image: redis:latest
    ports:
      - 6379:6379  # 호스트와 컨테이너의 포트 매핑
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf  # Redis 설정 파일
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]  # 설정 파일 사용
    networks:
      - elk
